<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Simulador 3D - Cubo e Pirâmide</title>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<style>
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#111}
#titulo,#instrucoes{position:fixed;left:50%;transform:translateX(-50%);z-index:999;color:#fff;background:rgba(0,0,0,.7);border-radius:22px;text-align:center;pointer-events:none}
#titulo{top:12px;padding:10px 20px;font-size:18px;font-weight:bold}#instrucoes{top:58px;padding:7px 14px;font-size:13px}
#controles{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-wrap:wrap;justify-content:center;gap:9px;width:96%}
.btn{padding:11px 17px;border-radius:25px;background:#1b67bd;color:#fff;font-weight:bold;border:0;cursor:pointer}.btn:hover{background:#2585e8}
#sliders,#info{position:fixed;top:105px;z-index:999;background:rgba(0,0,0,.72);padding:14px;border-radius:14px;color:#fff}#sliders{left:10px;width:175px;display:flex;flex-direction:column;gap:9px}#sliders input{width:100%}#info{right:10px;width:190px;font-size:13px;line-height:1.55}.azul{color:#55aaff}.laranja{color:#ffad42}.verde{color:#55e38a}#status{margin-top:8px;color:#9bd8ff;font-size:12px}
</style></head>
<body>
<div id="titulo">📐 GEOMETRIA 3D • CUBO E PIRÂMIDE</div>
<div id="instrucoes">Arraste para observar • W A S D para movimentar</div>
<div id="sliders"><b>Rotação</b>X:<input type="range" id="rot-x" min="-180" max="180" value="0">Y:<input type="range" id="rot-y" min="-180" max="180" value="0">Z:<input type="range" id="rot-z" min="-180" max="180" value="0"><div id="status">Medidas: VISÍVEIS</div></div>
<div id="info"><b>MEDIDAS</b><br><br><span class="azul">■ CUBO</span><br>Lado: <b>2 m</b><br>Altura: <b>2 m</b><br>Área total: <b>24 m²</b><br>Volume: <b>8 m³</b><br><br><span class="laranja">■ PIRÂMIDE</span><br>Base quadrada: <b>2 m</b><br>Altura: <b>3 m</b><br>Área da base: <b>4 m²</b><br>Volume: <b>4 m³</b></div>
<div id="controles"><button class="btn" id="btn-animar">▶️ Animar formas</button><button class="btn" id="btn-medidas">📏 Ocultar medidas</button><button class="btn" id="btn-separar">↔️ Separar formas</button><button class="btn" id="btn-original">🎯 Posição original</button></div>
<a-scene background="color:#20252b" renderer="antialias:true;colorManagement:true;physicallyCorrectLights:true" vr-mode-ui="enabled:false">
<a-entity light="type:ambient;intensity:1.5"></a-entity><a-entity light="type:directional;intensity:2" position="3 5 4"></a-entity><a-entity light="type:directional;intensity:1" position="-4 3 -3"></a-entity>
<a-entity id="formas" position="0 0 -7">
<!-- CUBO -->
<a-entity id="cuboGrupo" position="-2 1.15 0">
<a-box width="2" height="2" depth="2" material="color:#1677d2;opacity:.72;transparent:true;roughness:.25"></a-box>
<!-- arestas -->
<a-entity class="medida">
<a-cylinder position="-1 0 -1" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder><a-cylinder position="1 0 -1" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder><a-cylinder position="-1 0 1" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder><a-cylinder position="1 0 1" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder>
<a-cylinder position="0 -1 -1" rotation="0 0 90" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder><a-cylinder position="0 1 -1" rotation="0 0 90" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder><a-cylinder position="0 -1 1" rotation="0 0 90" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder><a-cylinder position="0 1 1" rotation="0 0 90" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder>
<a-cylinder position="-1 -1 0" rotation="90 0 0" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder><a-cylinder position="1 -1 0" rotation="90 0 0" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder><a-cylinder position="-1 1 0" rotation="90 0 0" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder><a-cylinder position="1 1 0" rotation="90 0 0" radius=".018" height="2" material="color:#7fc7ff"></a-cylinder>
</a-entity>
<!-- medidas cubo -->
<a-cylinder class="medida" position="0 -1.32 -1.15" rotation="0 0 90" radius=".012" height="2" material="color:#55e38a"></a-cylinder><a-text class="medida" value="2 m" position="0 -1.58 -1.15" color="#55e38a" align="center" width="1.4"></a-text>
<a-cylinder class="medida" position="-1.32 0 -1.15" radius=".012" height="2" material="color:#55e38a"></a-cylinder><a-text class="medida" value="2 m" position="-1.62 0 -1.15" color="#55e38a" align="center" width="1.2"></a-text>
<a-cylinder class="medida" position="1.25 -1.15 0" rotation="90 0 0" radius=".012" height="2" material="color:#55e38a"></a-cylinder><a-text class="medida" value="2 m" position="1.55 -1.15 0" color="#55e38a" rotation="0 90 0" align="center" width="1.2"></a-text>
<a-text value="CUBO" position="0 1.55 0" color="#55aaff" align="center" width="2"></a-text>
</a-entity>
<!-- PIRAMIDE -->
<a-entity id="piramideGrupo" position="2.2 .55 0">
<a-box width="2" height=".08" depth="2" position="0 -1 0" material="color:#e67d19;opacity:.85;transparent:true"></a-box>
<!-- faces triangulares -->
<a-triangle vertex-a="-1 0 -1" vertex-b="1 0 -1" vertex-c="0 3 0" material="color:#ff9e32;side:double;opacity:.8;transparent:true"></a-triangle>
<a-triangle vertex-a="1 0 -1" vertex-b="1 0 1" vertex-c="0 3 0" material="color:#e77d1d;side:double;opacity:.8;transparent:true"></a-triangle>
<a-triangle vertex-a="1 0 1" vertex-b="-1 0 1" vertex-c="0 3 0" material="color:#ffb14c;side:double;opacity:.8;transparent:true"></a-triangle>
<a-triangle vertex-a="-1 0 1" vertex-b="-1 0 -1" vertex-c="0 3 0" material="color:#d96e16;side:double;opacity:.8;transparent:true"></a-triangle>
<!-- arestas e medidas -->
<a-entity class="medida"><a-cylinder position="0 -1 -1" rotation="0 0 90" radius=".025" height="2" material="color:#ffd08a"></a-cylinder><a-cylinder position="0 -1 1" rotation="0 0 90" radius=".025" height="2" material="color:#ffd08a"></a-cylinder><a-cylinder position="-1 -1 0" rotation="90 0 0" radius=".025" height="2" material="color:#ffd08a"></a-cylinder><a-cylinder position="1 -1 0" rotation="90 0 0" radius=".025" height="2" material="color:#ffd08a"></a-cylinder></a-entity>
<a-cylinder class="medida" position="0 .5 -1.25" radius=".014" height="3" material="color:#55e38a"></a-cylinder><a-text class="medida" value="3 m" position=".3 .5 -1.25" color="#55e38a" align="center" width="1.3"></a-text>
<a-cylinder class="medida" position="0 -1.25 -1.2" rotation="0 0 90" radius=".014" height="2" material="color:#55e38a"></a-cylinder><a-text class="medida" value="2 m" position="0 -1.5 -1.2" color="#55e38a" align="center" width="1.3"></a-text>
<a-text value="PIRÂMIDE" position="0 2.35 0" color="#ffad42" align="center" width="2.2"></a-text><a-text value="BASE QUADRADA" position="0 2.08 0" color="#fff" align="center" width="1.6"></a-text>
</a-entity>
<a-plane rotation="-90 0 0" width="12" height="12" material="color:#15191e;opacity:.8;transparent:true;wireframe:true"></a-plane>
</a-entity>
<a-entity camera position="0 0 0" look-controls wasd-controls></a-entity>
</a-scene>
<script>
const formas=document.getElementById('formas'),cubo=document.getElementById('cuboGrupo'),piramide=document.getElementById('piramideGrupo'),status=document.getElementById('status');
const sx=document.getElementById('rot-x'),sy=document.getElementById('rot-y'),sz=document.getElementById('rot-z');
let animando=false,medidas=true,separado=false;
function rot(){formas.setAttribute('rotation',`${sx.value} ${sy.value} ${sz.value}`);animando=false;document.getElementById('btn-animar').textContent='▶️ Animar formas'}
sx.oninput=rot;sy.oninput=rot;sz.oninput=rot;
function loop(){if(!animando)return;formas.object3D.rotation.y+=.008;requestAnimationFrame(loop)}
document.getElementById('btn-animar').onclick=()=>{animando=!animando;document.getElementById('btn-animar').textContent=animando?'⏸ Parar animação':'▶️ Animar formas';status.textContent=animando?'Animação: ATIVA':'Animação: PAUSADA';if(animando)loop()};
document.getElementById('btn-medidas').onclick=()=>{medidas=!medidas;document.querySelectorAll('.medida').forEach(e=>e.setAttribute('visible',medidas));document.getElementById('btn-medidas').textContent=medidas?'📏 Ocultar medidas':'📏 Mostrar medidas';status.textContent=medidas?'Medidas: VISÍVEIS':'Medidas: OCULTAS'};
document.getElementById('btn-separar').onclick=()=>{separado=!separado;cubo.setAttribute('position',separado?'-3.2 1.15 0':'-2 1.15 0');piramide.setAttribute('position',separado?'3.4 .55 0':'2.2 .55 0');document.getElementById('btn-separar').textContent=separado?'↔️ Aproximar formas':'↔️ Separar formas';status.textContent=separado?'Formas: SEPARADAS':'Formas: JUNTAS'};
document.getElementById('btn-original').onclick=()=>{formas.setAttribute('position','0 0 -7');formas.setAttribute('rotation','0 0 0');cubo.setAttribute('position','-2 1.15 0');piramide.setAttribute('position','2.2 .55 0');sx.value=sy.value=sz.value=0;animando=false;separado=false;document.getElementById('btn-animar').textContent='▶️ Animar formas';document.getElementById('btn-separar').textContent='↔️ Separar formas';status.textContent='Posição original restaurada'};
</script></body></html>
