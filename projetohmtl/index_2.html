<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador 3D do Coração e Sistema Circulatório</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #050509;
    }

    #titulo {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      color: white;
      background: rgba(0,0,0,.65);
      padding: 12px 22px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      pointer-events: none;
    }

    #instrucoes {
      position: fixed;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      color: #ddd;
      background: rgba(0,0,0,.55);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
    }

    #controles {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 95%;
    }

    .btn {
      padding: 11px 17px;
      border-radius: 25px;
      background: #b5162a;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,.4);
    }

    .btn:hover {
      background: #e32942;
    }

    #sliders-rotacao {
      position: fixed;
      top: 110px;
      left: 12px;
      z-index: 999;
      background: rgba(0,0,0,.72);
      padding: 14px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      color: white;
      width: 175px;
    }

    #sliders-rotacao input {
      width: 100%;
    }

    #legenda {
      position: fixed;
      right: 12px;
      top: 110px;
      z-index: 999;
      background: rgba(0,0,0,.72);
      color: white;
      padding: 13px;
      border-radius: 14px;
      width: 190px;
      font-size: 13px;
      line-height: 1.55;
    }

    .vermelho { color: #ff465d; }
    .azul { color: #45a9ff; }

    #status {
      margin-top: 8px;
      color: #9fe8ff;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div id="titulo">❤️ CORAÇÃO 3D • SISTEMA CIRCULATÓRIO</div>

  <div id="instrucoes">
    Arraste para olhar ao redor • W A S D para movimentar
  </div>

  <div id="sliders-rotacao">
    <b>Rotação do sistema</b>
    X: <input type="range" id="rot-x" min="-180" max="180" value="0">
    Y: <input type="range" id="rot-y" min="-180" max="180" value="0">
    Z: <input type="range" id="rot-z" min="-180" max="180" value="0">
    <div id="status">Fluxo sanguíneo: ATIVO</div>
  </div>

  <div id="legenda">
    <b>Fluxo sanguíneo</b><br>
    <span class="vermelho">● Vermelho:</span> sangue oxigenado<br>
    <span class="azul">● Azul:</span> sangue desoxigenado<br><br>
    O coração pulsa enquanto partículas percorrem os vasos.
  </div>

  <div id="controles">
    <button class="btn" id="btn-bater">❤️ Parar batimentos</button>
    <button class="btn" id="btn-fluxo">🩸 Pausar fluxo</button>
    <button class="btn" id="btn-rotacao">🔄 Girar coração</button>
    <button class="btn" id="btn-original">🎯 Posição original</button>
    <button class="btn" id="btn-visao">🔬 Vista interna</button>
  </div>

  <a-scene
    background="color: #050509"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false">

    <a-entity light="type: ambient; intensity: 1.4; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 2.2; color: #ffffff" position="3 5 4"></a-entity>
    <a-entity light="type: point; intensity: 1.8; color: #ff304f" position="0 1 1"></a-entity>
    <a-entity light="type: point; intensity: 1.3; color: #328dff" position="0 -1 -1"></a-entity>

    <a-entity
      id="sistema"
      position="0 0 -5"
      rotation="0 0 0"
      scale="1 1 1">

      <!-- Coração 3D construído com formas A-Frame -->
      <a-entity id="coracao">

        <a-sphere
          id="ventriculo-esquerdo"
          position="-0.28 -0.12 0"
          scale="0.72 0.95 0.58"
          material="color:#9e1025; roughness:.32; metalness:.08">
        </a-sphere>

        <a-sphere
          id="ventriculo-direito"
          position="0.30 -0.12 0.03"
          scale="0.70 0.91 0.56"
          material="color:#c21c35; roughness:.30; metalness:.08">
        </a-sphere>

        <a-sphere
          position="-0.25 0.62 0"
          scale="0.58 0.52 0.53"
          material="color:#b5162b; roughness:.3">
        </a-sphere>

        <a-sphere
          position="0.28 0.62 0.02"
          scale="0.56 0.50 0.50"
          material="color:#c51c36; roughness:.3">
        </a-sphere>

        <!-- Sulco central -->
        <a-cylinder
          position="0 -0.25 0.54"
          rotation="90 0 0"
          radius=".035"
          height="1.05"
          material="color:#650817; roughness:.5">
        </a-cylinder>

        <!-- Artérias principais -->
        <a-cylinder
          position="-0.18 1.16 0"
          rotation="0 0 0"
          radius=".13"
          height=".78"
          material="color:#e22943; roughness:.25">
        </a-cylinder>

        <a-torus
          position="-0.18 1.53 0"
          rotation="90 0 0"
          radius=".22"
          radius-tubular=".09"
          material="color:#df2740">
        </a-torus>

        <!-- Veias principais -->
        <a-cylinder
          position="0.32 1.10 -0.02"
          radius=".12"
          height=".75"
          material="color:#286fca; roughness:.25">
        </a-cylinder>

        <!-- Aorta curva visual -->
        <a-torus
          position="0.02 1.50 0"
          rotation="90 0 0"
          radius=".38"
          radius-tubular=".105"
          arc="230"
          material="color:#e12b42; roughness:.25">
        </a-torus>

        <!-- Vasos pulmonares -->
        <a-cylinder
          position="-0.75 .78 .02"
          rotation="0 0 -55"
          radius=".075"
          height=".95"
          material="color:#327ac8">
        </a-cylinder>

        <a-cylinder
          position="0.72 .78 .02"
          rotation="0 0 55"
          radius=".075"
          height=".95"
          material="color:#e2364b">
        </a-cylinder>

        <!-- Pequenos vasos -->
        <a-torus
          position="-0.58 .15 .05"
          rotation="90 0 0"
          radius=".42"
          radius-tubular=".025"
          arc="250"
          material="color:#e33b50">
        </a-torus>

        <a-torus
          position="0.58 .10 .05"
          rotation="90 0 0"
          radius=".40"
          radius-tubular=".025"
          arc="250"
          material="color:#327ac8">
        </a-torus>

        <!-- Etiquetas -->
        <a-text value="AORTA"
          position="-1.0 1.75 0"
          color="#ff6678"
          align="center"
          width="1.4">
        </a-text>

        <a-text value="VEIA CAVA"
          position="1.05 1.45 0"
          color="#5eaeff"
          align="center"
          width="1.5">
        </a-text>

        <a-text value="CORAÇÃO"
          position="0 -1.25 .2"
          color="#ffffff"
          align="center"
          width="2">
        </a-text>
      </a-entity>

      <!-- Partículas de sangue -->
      <a-entity id="particulas-vermelhas"></a-entity>
      <a-entity id="particulas-azuis"></a-entity>

      <!-- Linhas/vasos do sistema circulatório ao redor -->
      <a-torus
        position="0 0 -0.25"
        rotation="90 0 0"
        radius="2.0"
        radius-tubular=".018"
        material="color:#c51d35; opacity:.7; transparent:true">
      </a-torus>

      <a-torus
        position="0 0 -0.30"
        rotation="90 0 0"
        radius="2.25"
        radius-tubular=".018"
        material="color:#277bc8; opacity:.55; transparent:true">
      </a-torus>

    </a-entity>

    <a-entity camera position="0 0 0" look-controls wasd-controls></a-entity>
  </a-scene>

<script>
  const sistema = document.getElementById('sistema');
  const coracao = document.getElementById('coracao');

  const sliderX = document.getElementById('rot-x');
  const sliderY = document.getElementById('rot-y');
  const sliderZ = document.getElementById('rot-z');

  const btnBater = document.getElementById('btn-bater');
  const btnFluxo = document.getElementById('btn-fluxo');
  const btnRotacao = document.getElementById('btn-rotacao');
  const btnOriginal = document.getElementById('btn-original');
  const btnVisao = document.getElementById('btn-visao');

  const vermelhas = document.getElementById('particulas-vermelhas');
  const azuis = document.getElementById('particulas-azuis');

  let batimentosAtivos = true;
  let fluxoAtivo = true;
  let rotacaoAtiva = false;
  let visaoInterna = false;
  let tempo = 0;

  const sangueVermelho = [];
  const sangueAzul = [];

  function criarParticulas(container, lista, cor, quantidade, raio) {
    for (let i = 0; i < quantidade; i++) {
      const p = document.createElement('a-sphere');

      p.setAttribute('radius', '0.035');
      p.setAttribute('material',
        `color:${cor}; emissive:${cor}; emissiveIntensity:.5`
      );

      const angulo = (i / quantidade) * Math.PI * 2;
      const distancia = raio + Math.random() * .35;

      p.object3D.position.set(
        Math.cos(angulo) * distancia,
        Math.sin(angulo) * distancia * .65,
        (Math.random() - .5) * .45
      );

      container.appendChild(p);
      lista.push({
        el: p,
        angulo: angulo,
        velocidade: 0.003 + Math.random() * 0.004,
        raio: distancia
      });
    }
  }

  criarParticulas(vermelhas, sangueVermelho, '#ff354f', 42, 1.15);
  criarParticulas(azuis, sangueAzul, '#38a5ff', 42, 1.35);

  function animarSangue(lista, sentido) {
    if (!fluxoAtivo) return;

    lista.forEach((p, i) => {
      p.angulo += p.velocidade * sentido;

      const r = p.raio;

      p.el.object3D.position.x =
        Math.cos(p.angulo) * r;

      p.el.object3D.position.y =
        Math.sin(p.angulo) * r * .62;

      p.el.object3D.position.z =
        Math.sin(p.angulo * 2 + i) * .18;
    });
  }

  function pulsar() {
    tempo += 0.045;

    if (!batimentosAtivos) {
      coracao.object3D.scale.set(1, 1, 1);
      return;
    }

    // Duas fases do batimento cardíaco
    const batida = Math.max(0, Math.sin(tempo * 4.8));
    const intensidade = 1 + batida * 0.075;

    coracao.object3D.scale.set(
      intensidade,
      intensidade * 0.98,
      intensidade
    );
  }

  function loop() {
    pulsar();
    animarSangue(sangueVermelho, 1);
    animarSangue(sangueAzul, -1);

    if (rotacaoAtiva) {
      sistema.object3D.rotation.y += 0.004;
    }

    requestAnimationFrame(loop);
  }

  loop();

  btnBater.addEventListener('click', () => {
    batimentosAtivos = !batimentosAtivos;

    btnBater.textContent = batimentosAtivos
      ? '❤️ Parar batimentos'
      : '❤️ Iniciar batimentos';

    document.getElementById('status').textContent =
      batimentosAtivos
        ? 'Batimentos: ATIVOS'
        : 'Batimentos: PAUSADOS';
  });

  btnFluxo.addEventListener('click', () => {
    fluxoAtivo = !fluxoAtivo;

    btnFluxo.textContent = fluxoAtivo
      ? '🩸 Pausar fluxo'
      : '🩸 Continuar fluxo';

    document.getElementById('status').textContent =
      fluxoAtivo
        ? 'Fluxo sanguíneo: ATIVO'
        : 'Fluxo sanguíneo: PAUSADO';
  });

  btnRotacao.addEventListener('click', () => {
    rotacaoAtiva = !rotacaoAtiva;

    btnRotacao.textContent = rotacaoAtiva
      ? '⏸ Parar rotação'
      : '🔄 Girar coração';
  });

  btnOriginal.addEventListener('click', () => {
    sistema.setAttribute('position', '0 0 -5');
    sistema.setAttribute('rotation', '0 0 0');
    sistema.setAttribute('scale', '1 1 1');

    sliderX.value = 0;
    sliderY.value = 0;
    sliderZ.value = 0;

    visaoInterna = false;
    document.getElementById('status').textContent =
      'Posição original restaurada';
  });

  btnVisao.addEventListener('click', () => {
    visaoInterna = !visaoInterna;

    if (visaoInterna) {
      // Abre visualmente o coração para demonstrar as cavidades.
      coracao.object3D.children.forEach((obj, i) => {
        if (i % 2 === 0) {
          obj.position.z += 0.18;
        }
      });

      btnVisao.textContent = '❤️ Vista externa';
      document.getElementById('status').textContent =
        'Vista interna demonstrativa';
    } else {
      coracao.object3D.children.forEach((obj, i) => {
        if (i % 2 === 0) {
          obj.position.z -= 0.18;
        }
      });

      btnVisao.textContent = '🔬 Vista interna';
      document.getElementById('status').textContent =
        'Vista externa';
    }
  });

  function atualizarRotacaoManual() {
    const x = sliderX.value;
    const y = sliderY.value;
    const z = sliderZ.value;

    sistema.setAttribute('rotation', `${x} ${y} ${z}`);
    rotacaoAtiva = false;
    btnRotacao.textContent = '🔄 Girar coração';
  }

  sliderX.addEventListener('input', atualizarRotacaoManual);
  sliderY.addEventListener('input', atualizarRotacaoManual);
  sliderZ.addEventListener('input', atualizarRotacaoManual);
</script>

</body>
</html>
